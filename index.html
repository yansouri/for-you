<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Pink Page</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
  }

  body {
    background: linear-gradient(180deg, #ffd6e7 0%, #ffb3d1 100%);
    font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    color: #7a2a52;
  }

  /* Container that holds all the falling pictures, sits behind your content */
  #falling {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .faller {
    position: absolute;
    top: -120px;
    height: auto;
    opacity: 0.9;
    animation-name: fall;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }

  @keyframes fall {
    from { transform: translateY(0) rotate(0deg); }
    to   { transform: translateY(calc(100vh + 240px)) rotate(360deg); }
  }

  /* Your actual page content goes here */
  main {
    position: relative;
    z-index: 1;
    display: grid;
    place-items: center;
    height: 100%;
    text-align: center;
    padding: 1rem;
  }

  h1 {
    font-size: clamp(2rem, 6vw, 4rem);
    margin: 0 0 0.5rem;
  }

  @media (prefers-reduced-motion: reduce) {
    .faller { animation: none; top: 20%; }
  }
.card {
  background: #fff7fb;
  border: 6px solid #ff8fbf;
  outline: 4px dotted #ffffff;
  outline-offset: -14px;
  border-radius: 32px;
  padding: 2rem 1.5rem;
  width: min(90vw, 420px);
  box-shadow: 0 10px 0 #ff8fbf80, 0 20px 40px #ff6fa833;
}

.gif-box {
  width: 100%;
  aspect-ratio: 1 / 1;
  border-radius: 20px;
  border: 4px solid #ffc2dc;
  background: #ffe9f3;
  overflow: hidden;
  display: grid;
  place-items: center;
}

.gif-box img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.card-text {
  margin: 1.2rem 0 1.4rem;
  font-size: 1.4rem;
  font-weight: bold;
  color: #c2407e;
}

.buttons {
  display: flex;
  gap: 1rem;
  justify-content: center;
}

.btn {
  font: inherit;
  font-size: 1.2rem;
  font-weight: bold;
  padding: 0.7rem 2.2rem;
  border: 4px solid #fff;
  border-radius: 999px;
  cursor: pointer;
  color: #fff;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.btn.yes {
  background: #ff5fa2;
  box-shadow: 0 6px 0 #d63d82;
}

.btn.no {
  background: #9ec5ff;
  box-shadow: 0 6px 0 #6f9fe6;
}

.btn:hover {
  transform: translateY(-3px) scale(1.06);
}

.btn:active {
  transform: translateY(4px);
  box-shadow: 0 2px 0 rgba(0, 0, 0, 0.15);
}

.btn:focus-visible {
  outline: 3px solid #7a2a52;
  outline-offset: 3px;
}
</style>
</head>
<body>

<div id="falling"></div>

<main>
  <main>
  <div class="card">
    <div class="gif-box">
      <img src="cat.gif" alt="">
    </div>

    <p class="card-text">Be my gf? 💕</p>

    <div class="buttons">
      <button class="btn yes" id="yes">Yes</button>
      <button class="btn no" id="no">No</button>
    </div>
  </div>
</main>
</main>

<script>
  // 1. Put your own image files next to this HTML file and list them here.
  //    Transparent PNGs work best.
  const images = [
    "melody.png",
    "cinnamoroll.png"
  ];

  const COUNT = 25;   // how many are falling at once
  const container = document.getElementById("falling");

  for (let i = 0; i < COUNT; i++) {
    const img = document.createElement("img");
    img.src = images[i % images.length];
    img.className = "faller";
    img.alt = "";

    const size = 40 + Math.random() * 60;            // 40–100px
    img.style.width = size + "px";
    img.style.left = Math.random() * 100 + "vw";     // random column
    img.style.animationDuration = 8 + Math.random() * 10 + "s";  // speed
    img.style.animationDelay = -Math.random() * 18 + "s";        // stagger start

    container.appendChild(img);
  }
  document.getElementById("yes").addEventListener("click", () => {
  document.querySelector(".card-text").textContent = "Yay!! 🎀 (btw i get a notification on my phone when u click it lol)";
  notify("They clicked YES");
});
 document.getElementById("no").addEventListener("click", () => {
  document.querySelector(".card-text").textContent = "oh well";
  notify("They clicked NO");
});
const TOPIC = "maramyesno";

function notify(message) {
  fetch("https://ntfy.sh/" + TOPIC, {
    method: "POST",
    body: message
  }).catch(() => {});
};
</script>

</body>
</html>
